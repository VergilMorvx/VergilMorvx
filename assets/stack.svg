
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360">


<defs>

  <pattern id="stone" width="48" height="48"
           patternUnits="userSpaceOnUse">

    <rect width="48" height="48" fill="#353535"/>

    <rect x="2" y="2" width="21" height="21" fill="#444444"/>
    <rect x="25" y="2" width="21" height="21" fill="#2d2d2d"/>

    <rect x="2" y="25" width="21" height="21" fill="#303030"/>
    <rect x="25" y="25" width="21" height="21" fill="#494949"/>

    <rect x="7" y="7" width="6" height="5" fill="#555555"/>
    <rect x="17" y="15" width="5" height="5" fill="#242424"/>

    <rect x="31" y="8" width="7" height="5" fill="#505050"/>
    <rect x="38" y="17" width="5" height="5" fill="#222222"/>

    <rect x="8" y="31" width="6" height="6" fill="#505050"/>
    <rect x="18" y="38" width="5" height="5" fill="#252525"/>

    <rect x="31" y="31" width="8" height="6" fill="#585858"/>

  </pattern>


  <pattern id="dirt" width="48" height="48"
           patternUnits="userSpaceOnUse">

    <rect width="48" height="48" fill="#765032"/>

    <rect x="4" y="4" width="8" height="7" fill="#91613b"/>
    <rect x="18" y="3" width="6" height="6" fill="#50321e"/>
    <rect x="34" y="7" width="9" height="8" fill="#986840"/>

    <rect x="7" y="21" width="8" height="9" fill="#53351f"/>
    <rect x="22" y="18" width="9" height="7" fill="#9f6b42"/>
    <rect x="37" y="25" width="6" height="7" fill="#583821"/>

    <rect x="3" y="38" width="10" height="6" fill="#956039"/>
    <rect x="20" y="35" width="6" height="8" fill="#54341f"/>
    <rect x="32" y="39" width="10" height="5" fill="#875832"/>

  </pattern>


  <pattern id="grass" width="48" height="18"
           patternUnits="userSpaceOnUse">

    <rect width="48" height="18" fill="#5e9c43"/>

    <rect x="0" y="0" width="8" height="7" fill="#73b556"/>
    <rect x="8" y="4" width="8" height="9" fill="#4f8838"/>
    <rect x="16" y="0" width="8" height="10" fill="#79ba59"/>
    <rect x="24" y="5" width="8" height="8" fill="#548c3d"/>
    <rect x="32" y="1" width="8" height="8" fill="#6cab4e"/>
    <rect x="40" y="4" width="8" height="9" fill="#477a32"/>

  </pattern>


  <linearGradient id="slot"
                  x1="0" y1="0"
                  x2="1" y2="1">

    <stop offset="0" stop-color="#8b8b8b"/>
    <stop offset="1" stop-color="#6d6d6d"/>

  </linearGradient>

</defs>


<rect width="1200"
      height="360"
      fill="#0d1117"/>

